<label for="id_subcategory">Подкатегория</label>
<select name="subcategory" id="id_subcategory"
        hx-get="{% url 'api_subcategories' %}"
        hx-trigger="change from:#id_category"
        hx-target="#id_subcategory"
        hx-include="[name=category]"
        class="form-select">
    <option value="">---------</option>
    {% for subcategory in subcategories %}
        <option value="{{ subcategory.id }}"
                {% if subcategory.id == view.get_object.subcategory.id|default:'' or subcategory.id|stringformat:"i" == form.subcategory.value %}selected{% endif %}>
            {{ subcategory.name }}
        </option>
    {% endfor %}
</select>
{% if form.subcategory.errors %}<div class="text-danger">{{ form.subcategory.errors }}</div>{% endif %}
